
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: registrydb
      POSTGRES_USER: registryuser
      POSTGRES_PASSWORD: registrypass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
