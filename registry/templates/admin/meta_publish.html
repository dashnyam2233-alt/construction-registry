{% extends "admin/base_site.html" %}
{% block content %}
  <div style="max-width: 900px;">
    <h1>{{ title }}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <fieldset class="module aligned">
        {{ form.as_p }}
      </fieldset>
      <div class="submit-row">
        <input type="submit" value="Publish" class="default">
      </div>
    </form>
  </div>
{% endblock %}
