{% extends "admin/change_list.html" %}
{% load i18n %}
{% load admin_urls %}

{% block extrahead %}
  {{ block.super }}

  <style>
    /* ✅ Big default H1 hide */
    body.change-list #content > h1 { display: none !important; }

    /* ✅ Top toolbar layout tweaks */
    body.change-list #toolbar {
      display: flex !important;
      gap: 10px !important;
      align-items: center !important;
      flex-wrap: wrap !important;
    }

    /* Search form */
    body.change-list #changelist-search {
      display: flex !important;
      gap: 8px !important;
      align-items: center !important;
      flex-wrap: wrap !important;
      margin: 0 !important;
    }

    body.change-list #changelist-search label {
      margin: 0 !important;
      font-size: 12px !important;
      opacity: .85 !important;
    }

    body.change-list #changelist-search input[name="q"]{
      min-width: 280px !important;
    }

    @media (max-width: 900px){
      body.change-list #changelist-search input[name="q"]{ min-width: 200px !important; }
    }

    /* ✅ Add button next to search */
    body.change-list .cr-add-next-to-search{
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      padding: 6px 12px !important;
      border-radius: 999px !important;
      text-decoration: none !important;
      font-size: 12px !important;
      line-height: 1.1 !important;
      white-space: nowrap !important;
    }

    /* ✅ Action hint under actions row */
    body.change-list #changelist-form .cr-action-hint{
      margin: 6px 0 12px 0 !important;
      padding: 8px 10px !important;
      border-left: 4px solid #6aa86a !important;
      background: #f3fbf3 !important;
      border-radius: 6px !important;
      font-size: 13px !important;
      line-height: 1.35 !important;
      color: #1f3b1f !important;
    }

    /* ✅ Хуучин жижиг fixed tools үлдсэн байвал бүр мөсөн нуух */
    #cr-tools-fixed{ display: none !important; }

    /* =========================
       ✅ Chat Drawer (overlay)
       ========================= */
    .cr-drawer{
      position: fixed !important;
      top: 0 !important;
      right: 0 !important;
      height: 100vh !important;
      width: 380px !important;
      max-width: 92vw !important;
      background: #fff !important;
      box-shadow: -12px 0 28px rgba(0,0,0,.18) !important;
      transform: translateX(104%) !important;
      transition: transform .18s ease-in-out !important;
      z-index: 9999 !important;
      display: flex !important;
      flex-direction: column !important;
    }
    .cr-drawer.open{ transform: translateX(0) !important; }

    .cr-drawer-header{
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 12px 14px !important;
      border-bottom: 1px solid rgba(0,0,0,.08) !important;
      font-weight: 700 !important;
    }
    .cr-drawer-close{
      border: 0 !important;
      background: transparent !important;
      font-size: 18px !important;
      cursor: pointer !important;
      line-height: 1 !important;
      padding: 6px 8px !important;
      border-radius: 10px !important;
    }
    .cr-drawer-body{
      padding: 12px 14px !important;
      overflow: auto !important;
      height: 100% !important;
    }

    .cr-overlay{
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,.28) !important;
      z-index: 9998 !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity .18s ease-in-out !important;
    }
    .cr-overlay.show{
      opacity: 1 !important;
      pointer-events: auto !important;
    }
  </style>

  <script>
    (function () {
      function ready(fn) {
        if (document.readyState !== "loading") fn();
        else document.addEventListener("DOMContentLoaded", fn);
      }

      function key() {
        return "cr_admin_search_focus:" + window.location.pathname;
      }

      ready(function () {
        var modelCap = "{{ cl.opts.verbose_name|capfirst }}";
        var model = "{{ cl.opts.model_name }}";

        // 1) Search focus save/restore
        var form = document.getElementById("changelist-search");
        if (form) {
          var input = form.querySelector('input[name="q"]');
          if (input) {
            input.addEventListener("input", function () {
              try { sessionStorage.setItem(key(), input.value || ""); } catch (e) {}
            });

            try {
              var saved = sessionStorage.getItem(key());
              if (saved !== null) {
                input.value = input.value || saved || "";
                setTimeout(function () {
                  try {
                    input.focus({ preventScroll: true });
                    var len = input.value.length;
                    input.setSelectionRange(len, len);
                  } catch (e) {}
                }, 0);
              }
            } catch (e) {}
          }
        }

        // 2) Search label: "<Model> хайх"
        try {
          var lbl = document.querySelector("#changelist-search label");
          if (lbl) lbl.textContent = modelCap + " хайх";
        } catch (e) {}

        // 3) Action hint under actions row (once)
        try {
          var actions = document.querySelector("#changelist-form .actions");
          if (actions && !document.getElementById("cr-action-hint")) {
            var div = document.createElement("div");
            div.id = "cr-action-hint";
            div.className = "cr-action-hint";
            div.textContent = modelCap + "-г өөрчлөх бол идэвхжүүлнэ үү?";
            actions.insertAdjacentElement("afterend", div);
          }
        } catch (e) {}

        // 4) Move "Add" button next to search (if exists)
        try {
          var searchForm = document.getElementById("changelist-search");
          if (searchForm && !document.getElementById("cr-add-next-to-search")) {
            var tools2 = document.querySelector("#content .object-tools");
            var addLink = tools2 ? tools2.querySelector("a.addlink") : null;

            if (addLink) {
              addLink.id = "cr-add-next-to-search";
              addLink.classList.add("cr-add-next-to-search");
              searchForm.appendChild(addLink);
            }
          }
        } catch (e) {}

        // 5) Import template button (existing behavior)
        try {
          var bar = document.getElementById("cr-actionbar");
          if (bar) {
            var left = bar.querySelector(".cr-left");
            if (left && !document.getElementById("cr-import-template-btn")) {
              var url = "";
              var text = "";
              if (model === "worker") {
                url = "{% url 'admin:registry_worker_import_template' %}";
                text = "📥 Ажилтан импортын загвар (MN)";
              } else if (model === "company") {
                url = "{% url 'admin:registry_company_import_template' %}";
                text = "📥 Компани импортын загвар (MN)";
              }
              if (url) {
                var a = document.createElement("a");
                a.id = "cr-import-template-btn";
                a.href = url;
                a.style.display = "inline-flex";
                a.style.alignItems = "center";
                a.style.gap = "6px";
                a.style.padding = "6px 12px";
                a.style.borderRadius = "999px";
                a.style.textDecoration = "none";
                a.style.fontSize = "12px";
                a.style.lineHeight = "1.1";
                a.style.whiteSpace = "nowrap";
                a.textContent = text;
                left.insertBefore(a, left.children[2] || null);
              }
            }
          }
        } catch (e) {}

        // =========================
        // ✅ Chat drawer (open from existing top-right "чат")
        // =========================
        function ensureOverlay() {
          var ov = document.getElementById("cr-overlay");
          if (ov) return ov;
          ov = document.createElement("div");
          ov.id = "cr-overlay";
          ov.className = "cr-overlay";
          document.body.appendChild(ov);
          return ov;
        }

        function closeAll() {
          var ov = document.getElementById("cr-overlay");
          if (ov) ov.classList.remove("show");
          document.querySelectorAll(".cr-drawer").forEach(function(d){ d.classList.remove("open"); });
        }

        function openDrawer(id) {
          closeAll();
          ensureOverlay().classList.add("show");
          var d = document.getElementById(id);
          if (d) d.classList.add("open");
        }

        function buildDrawer(id, title, contentEl) {
          if (!contentEl) return null;
          var existing = document.getElementById(id);
          if (existing) return existing;

          contentEl.style.display = "block";
          contentEl.style.visibility = "visible";
          contentEl.style.opacity = "1";

          var drawer = document.createElement("div");
          drawer.id = id;
          drawer.className = "cr-drawer";

          var header = document.createElement("div");
          header.className = "cr-drawer-header";

          var t = document.createElement("div");
          t.textContent = title;

          var closeBtn = document.createElement("button");
          closeBtn.type = "button";
          closeBtn.className = "cr-drawer-close";
          closeBtn.setAttribute("aria-label", "Close");
          closeBtn.textContent = "✕";
          closeBtn.addEventListener("click", closeAll);

          header.appendChild(t);
          header.appendChild(closeBtn);

          var body = document.createElement("div");
          body.className = "cr-drawer-body";
          body.appendChild(contentEl);

          drawer.appendChild(header);
          drawer.appendChild(body);
          document.body.appendChild(drawer);

          return drawer;
        }

        var chatEl =
          document.getElementById("cr-chat") ||
          document.querySelector(".cr-chat") ||
          document.querySelector("[data-cr-chat]") ||
          document.getElementById("chat") ||
          document.querySelector(".chat");

        if (chatEl) {
          buildDrawer("cr-chat-drawer", "Чат", chatEl);

          function bindChatOpen(el){
            if (!el || el.__crBoundChat) return;
            el.__crBoundChat = true;
            el.addEventListener("click", function(e){
              e.preventDefault();
              openDrawer("cr-chat-drawer");
            });
          }

          var headerEl = document.getElementById("header") || document.querySelector("#header");
          if (headerEl) {
            headerEl.querySelectorAll("a,button").forEach(function(el){
              var t = (el.textContent || "").trim().toLowerCase();
              if (t.includes("чат")) bindChatOpen(el);
            });
          }

          var ov = ensureOverlay();
          ov.addEventListener("click", closeAll);
          document.addEventListener("keydown", function(e){
            if (e.key === "Escape") closeAll();
          });
        }
      });
    })();
  </script>
{% endblock %}
