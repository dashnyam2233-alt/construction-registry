{% load static %}
<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ provider }} нэвтрэлт</title>
  <link rel="stylesheet" href="{% static 'registry/public_home.css' %}?v=4">
  <style>
    body{background:#f6f7fb}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,92vw);background:#fff;border:1px solid #eaecf0;border-radius:16px;box-shadow:0 10px 25px rgba(16,24,40,.08);padding:18px}
    .muted{color:#667085}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 8px">{{ provider }}-ээр нэвтрэх</h2>
      <p class="muted" style="margin:0 0 14px">
        Энэ хэсэг одоогоор <b>түр</b>. Дараагийн хөгжүүлэлтээр бодит интеграци (OAuth/SSO/KYC) хийнэ.
      </p>
      <a class="btn btn--primary" href="/login/">Буцах</a>
      <a class="btn btn--ghost" href="/public/" style="margin-left:8px">Public руу</a>
    </div>
  </div>
</body>
</html>
