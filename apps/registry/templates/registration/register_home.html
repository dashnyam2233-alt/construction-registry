<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шинээр бүртгүүлэх</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;margin:0;}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
    .card{width:min(720px,92vw);background:#fff;border:1px solid #eaecf0;border-radius:16px;box-shadow:0 10px 25px rgba(16,24,40,.08);padding:18px;}
    h1{margin:0 0 6px;font-size:20px}
    .muted{color:#667085;font-size:13px;margin:0 0 14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    a{display:block;text-decoration:none;border:1px solid #eaecf0;border-radius:16px;padding:14px;color:#101828;background:#fff}
    a:hover{border-color:#cbd5e1}
    .t{font-weight:900}
    .d{color:#667085;font-size:13px;margin-top:6px;line-height:1.45}
    .row{margin-top:12px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:900;border:1px solid #eaecf0;color:#101828}
    @media(max-width:680px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Шинээр бүртгүүлэх</h1>
      <p class="muted">Та ямар төрлөөр бүртгүүлэхээ сонгоно уу.</p>

      <div class="grid">
        <a href="/register/company/">
          <div class="t">🏢 Компани бүртгүүлэх</div>
          <div class="d">Компанийн мэдээлэл + нэвтрэх хэрэглэгч үүсгэнэ.</div>
        </a>

        <a href="/register/worker/">
          <div class="t">👷 Ажилтан бүртгүүлэх</div>
          <div class="d">Ажилтны мэдээлэл + нэвтрэх хэрэглэгч үүсгэнэ.</div>
        </a>
      </div>

      <div class="row">
        <a class="btn" href="/login/">← Нэвтрэх рүү буцах</a>
      </div>
    </div>
  </div>
</body>
</html>
